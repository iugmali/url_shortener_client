version: '3.7'

services:
  url_shortener_client:
    build:
      context: .
    container_name: url_shortener_client
    restart: always
    ports:
      - "3888:80"
    volumes:
      - ./web:/usr/share/nginx/html
    networks:
      - url-shortener-client


networks:
  url-shortener-client:
    driver: bridge